name: CI/CD Pipeline for Serverless

on:
  push:
    branches:
      - main
      - feature/TIRBE-129  # 테스트 브랜치

jobs:
  ci_cd:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      STAGE: prod
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Node.js 환경 설정 (Serverless Framework 실행)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Python 환경 설정 (Python 프로젝트 배포)
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.12

      # 의존성 설치
      - name: Install dependencies
        run: npm install

      # Serverless Framework 설치
      - name: Install Serverless Framework
        run: npm install -g serverless

      # Serverless Framework 로그인
      - name: Serverless Login
        run: serverless config credentials --provider aws --key $AWS_ACCESS_KEY_ID --secret $AWS_SECRET_ACCESS_KEY --profile default

      # Serverless 배포 실행
      - name: Deploy to AWS using Serverless
        run: sls deploy --stage $STAGE --region $AWS_REGION
