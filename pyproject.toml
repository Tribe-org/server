[tool.poetry]
name = "tribe-server"
version = "0.1.0"
description = "FastAPI Server for Tribe"
authors = ["Tribe"]
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
annotated-types = "0.7.0"
anyio = "4.4.0"
bcrypt = "4.2.0"
cachetools = "5.5.0"
certifi = "2024.7.4"
charset-normalizer = "3.3.2"
click = "8.1.7"
fastapi = "0.112.2"
h11 = "0.14.0"
httpcore = "1.0.5"
httplib2 = "0.22.0"
httpx = "0.27.0"
idna = "3.8"
itsdangerous = "2.2.0"
oauthlib = "3.2.2"
passlib = "1.7.4"
proto-plus = "1.24.0"
protobuf = "5.27.3"
psycopg2-binary = "2.9.9"
pyasn1 = "0.6.0"
pyasn1-modules = "0.4.0"
pydantic = "2.8.2"
pydantic-core = "2.20.1"
PyJWT = "2.9.0"
pyparsing = "3.1.4"
python-dotenv = "1.0.1"
python-multipart = "0.0.10"
requests = "2.32.3"
requests-oauthlib = "2.0.0"
rsa = "4.9"
sniffio = "1.3.1"
SQLAlchemy = "2.0.35"
starlette = "0.38.2"
typing-extensions = "4.12.2"
uritemplate = "4.1.1"
urllib3 = "2.2.2"
uvicorn = "0.30.6"
mangum = "*"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  | blib2to3
  | tests/data
  | profiling
)/
'''
preview = true

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip = [".gitignore", ".dockerignore"]
skip_glob = ["**/migrations/*.py"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
known_first_party = ["app"] 