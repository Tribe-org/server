service: tribe-server

frameworkVersion: '4'

package:
  # packaging 시, 포함하고 제외할 파일 및 폴더를 파악합니다.
  # !가 있으면 제외, 없으면 포함합니다.
  patterns:
    - '!poetry.lock'
    - '!README.md'
    - '!node_modules/**'
    - '!.venv/**'
    - '!.serverless/**'
    - '!package.json'
    - '!package-lock.json'
    - '!aws/**'

custom:
  pythonRequirements:
    useStaticCache: false # static cache와
    useDownloadCache: false
    dockerizePip: true
    layer:
      name: serverless-fastapi-deps
      description: Dependencies of serverless-fastapi
      compatibleRuntimes:
        - python3.12

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}  # 기본 dev 스테이지 사용
  region: ap-northeast-2  # 서울 리전
  memorySize: 512  # 메모리 크기
  timeout: 30  # 타임아웃 설정
  environment:
    STAGE: ${self:provider.stage}
    APP_SECRET_KEY: ${env:APP_SECRET_KEY}  
    CLIENT_URL: ${env:CLIENT_URL}
    DATABASE_URL: ${env:DATABASE_URL}
    NAVER_CLIENT_ID: ${env:NAVER_CLIENT_ID}
    NAVER_CLIENT_SECRET: ${env:NAVER_CLIENT_SECRET}
    NAVER_REDIRECT_URL: ${env:NAVER_REDIRECT_URL}

functions:
  api:
    handler: app.main.handler
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    events:
      # API 가 생성될때마다 추가하는게 좋습니다. (공통으로 사용하는 방법은 아직 해보지 않음)
      - http:
          method: GET
          path: /
      - http:
          method: GET
          path: /v1/docs
          cors: true
      - http:
          method: GET
          path: /v1/openapi.json
          cors: true
      - http:
          method: POST
          path: /v1/auth/naver
      - http:
          method: GET
          path: /v1/auth/start
      - http:
          method: GET
          path: /v1/auth/callback
      - http:
          method: POST
          path: /v1/auth/naver/user_info
      - http:
          method: POST
          path: /v1/auth/sign-up
      - http:
          method: POST
          path: /v1/auth/token/refresh
      - http:
          method: POST
          path: /v1/auth/token/validate
      - http:
          method: GET
          path: /v1/badge/all


plugins:
  - serverless-python-requirements
  - serverless-offline